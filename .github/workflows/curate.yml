# 精选认证：issue 打上 approved 标签 → 自动收录进 scripts/curated.json。
# 触发条件：任意 issue 被标记 approved（维护者审核通过后手动打的标签）。
# 收录结果在下次 sync（每 2 小时）时被 score.mjs 读取，插件获得 certified 标记与 🏅 徽章。
#
# 安全说明（2026-08-16 修复）：
# 早期版本用 bash grep 从 issue body 提取仓库/npm，但 issue 正文可能含反引号内容
# （如 `dsh.bundle`、`dsh plugin add ...`），bash 展开 $NPM 时会触发命令注入
# （"dsh: command not found"）。现改为经环境变量把整个 body 传给 node 解析
# （scripts/curate.mjs 的 parseIssueBody），彻底规避 bash 正则与命令展开。
name: curate
on:
  issues:
    types: [labeled]

permissions:
  contents: write

jobs:
  curate:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 从 issue body 解析并收录
        run: node scripts/curate.mjs --body "$ISSUE_BODY" --issue "${{ github.event.issue.number }}"
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
      - name: 提交变更
        run: |
          git config user.name "dsh-recommend bot"
          git config user.email "actions@github.com"
          git add scripts/curated.json
          git diff --cached --quiet && echo "无变化" || git commit -m "data: 精选认证 issue #${{ github.event.issue.number }}"
          git push
