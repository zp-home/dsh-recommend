# 定期数据同步：全量重算（fetch → score×2 → scan → history → badge → validate），
# 数据变化直接提交回 main（Git 即数据库）；月末自动生成月度生态报告。
name: sync
on:
  schedule:
    - cron: '17 */5 * * *'   # 每 5 小时整点过 17 分同步（UTC；全量抓取耗 API 配额，2h 过密）
  workflow_dispatch: {}

concurrency:
  group: dsh-recommend-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 数据管道全量重算（含深扫验证）
        run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 生成/更新月度生态报告
        run: node scripts/report.mjs --out docs/reports
      - name: 提交数据变更
        run: |
          git config user.name "dsh-recommend bot"
          git config user.email "actions@github.com"
          git add data/ CHANGELOG.md docs/reports/
          git diff --cached --quiet && echo "无数据变化" || git commit -m "data: 生态同步 $(date -u +%Y-%m-%dT%H:%M)Z"
          # 并发保护：全量重算耗时 10-15 分钟，期间可能有其他提交进 main，
          # 直接 push 会 non-fast-forward 失败。先 rebase 远端再推，自动合并。
          git pull --rebase origin main || (echo "rebase 冲突，重跑一次管道" && git rebase --abort && exit 1)
          git push
