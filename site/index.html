<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsh-recommend · DSH 插件排行</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="home-page">
  <header>
    <h1>🐋 dsh-recommend <span class="tag">DSH 插件透明排行</span></h1>
    <p class="meta" id="meta">加载中…</p>
    <nav class="nav">
      <a href="./index.html" class="active">综合榜</a>
      <a href="./rankings.html">发展排行榜</a>
      <a href="https://github.com/zp-home/dsh-recommend/issues/new?template=submit-plugin.yml" target="_blank" rel="noopener">提交插件 / 申请认证 🏅</a>
    </nav>
  </header>

  <main class="layout">
    <!-- 主榜单列 -->
    <div class="layout-main">
      <section class="controls">
        <input id="search" type="search" placeholder="搜索名称 / 描述 / 分类…">
        <select id="view">
          <option value="score">按综合分</option>
          <option value="stars">按热度（★）</option>
          <option value="updated">按最近更新</option>
          <option value="newest">按最新发布</option>
        </select>
        <select id="category"><option value="">全部分类</option></select>
        <label class="toggle"><input type="checkbox" id="showExcluded"> 显示被排除仓库</label>
      </section>

      <div id="list" class="list"></div>
      <div id="pager" class="pager"></div>
      <p class="meta" id="count"></p>
    </div>

    <!-- 右侧精选认证栏：经 issue 审核通过的插件（无认证插件时自动隐藏） -->
    <aside class="layout-side">
      <section id="certified-showcase" class="cert-showcase" hidden>
        <div class="cert-head">
          <div>
            <span class="cert-title"><span class="cert-title-icon" aria-hidden="true">🏅</span>精选认证</span>
            <p class="cert-sub">经 issue 审核的优质插件</p>
          </div>
          <span class="cert-count" id="cert-count"></span>
        </div>
        <div class="cert-list" id="cert-list"></div>
      </section>
    </aside>
  </main>

  <footer>
    <p>收录 ≠ 安全背书。安装第三方插件前请自行审查源码。数据每日自动重算，公式公开可复算（<a href="../docs/scoring.md">评分模型</a>）。</p>
    <p class="meta footer-links">榜单源码与数据：<a href="https://github.com/zp-home/dsh-recommend" target="_blank" rel="noopener">github.com/zp-home/dsh-recommend</a> · 觉得有用就点个 ⭐，支持我们继续维护</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
